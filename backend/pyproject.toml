[project]
name = "okeder-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "arq>=0.26.0",
    "redis>=5.0.0",
    "stripe>=9.0.0",
    "httpx>=0.27.0",
    "python-telegram-bot>=21.0.0",
    "pgvector>=0.3.0",
    "openai>=1.30.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=42.0.0",
    "pywebpush>=1.14.0",
    "py-vapid>=1.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
